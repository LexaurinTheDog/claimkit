<body class="bg-background text-foreground">
<div class="bg-background text-foreground min-h-screen flex flex-col font-sans antialiased">
  <!-- Persistent Legal Banner -->
  <div class="w-full border-b border-border bg-muted py-3 px-4 text-center text-sm md:text-base font-medium text-muted-foreground shadow-sm sticky top-0 z-50">
    Nejde o právní poradenství.
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 container mx-auto p-4 md:p-8 max-w-2xl">

    <!-- Progress Header -->
    <header class="mb-8 text-center">
      <h1 class="text-2xl font-bold tracking-tight mb-2">Krok 2 z 5: Zavazadlo</h1>
      <div class="w-full bg-muted rounded-full h-2 overflow-hidden">
        <div class="bg-primary h-2 rounded-full w-[40%]" style="width: 40%"></div>
      </div>
    </header>

    <!-- Form -->
    <form id="claim-form" class="space-y-6">

      <!-- Local Storage Note -->
      <div class="p-3 bg-muted/50 rounded-md text-xs text-muted-foreground border border-border flex items-center gap-2">
        <img aria-hidden="true" alt="save-icon" src="https://placehold.co/16x16.svg?text=💾" />
        Uloženo v tomto prohlížeči před chvílí
      </div>

      <!-- Field 1: Date Found -->
      <div class="space-y-2">
        <label for="date-found" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
          Kdy jste zjistili ztrátu?
        </label>
        <input type="text" id="date-found" placeholder="12. 9. 2026" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" />
        <p class="text-xs text-muted-foreground">Přibližné datum, kdy jste zjistili, že zavazadlo chybí.</p>
      </div>

      <!-- Field 2: Flight Number -->
      <div class="space-y-2">
        <label for="flight-number" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
          Číslo letu
        </label>
        <input type="text" id="flight-number" placeholder="OK 123" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" />
        <p class="text-xs text-muted-foreground">Kód a číslo letu (např. OK 123).</p>
      </div>

      <!-- Field 3: PIR Number -->
      <div class="space-y-2">
        <label for="pir-number" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
          Číslo hlášení o ztrátě (PIR)
        </label>
        <input type="text" id="pir-number" placeholder="PRGOK12345" class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" />
        <p class="text-xs text-muted-foreground">Reference z letištního hlášení o ztrátě.</p>
      </div>

      <!-- Field 4: Contents -->
      <div class="space-y-2">
        <label for="contents" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
          Co zavazadlo obsahovalo?
        </label>
        <textarea id="contents" rows="4" placeholder="Popište, co bylo v zavazadle..." class="flex min-h-[80px] w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"></textarea>
        <p class="text-xs text-muted-foreground">Detailní seznam položek pro odhad hodnoty.</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between pt-4 border-t border-border">
        <button type="button" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4">
          Zpět
        </button>
        <button type="submit" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/80 h-10 px-4">
          Pokračovat
        </button>
      </div>

    </form>
  </main>

  <script>
    // Simple JS for interactivity
    const form = document.getElementById('claim-form');

    // Add visual feedback on input changes (simulating "Saved" state)
    const inputs = form.querySelectorAll('input, textarea');
    inputs.forEach(input => {
      input.addEventListener('input', () => {
        // In a real app, this would trigger local storage save
        console.log('Field updated:', input.id);
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      console.log('Pokračovat na další krok');
    });
  </script>
