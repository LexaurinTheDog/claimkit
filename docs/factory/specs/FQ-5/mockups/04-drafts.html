<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Draft mockup generated by OpenUI (wandb/openui) via .factory/scripts/mockup.sh. Not product code. -->
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
tailwind.config = { darkMode: ['class'], theme: { extend: { colors: {
  border: 'hsl(var(--border))', input: 'hsl(var(--input))', ring: 'hsl(var(--ring))',
  background: 'hsl(var(--background))', foreground: 'hsl(var(--foreground))',
  primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
  secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
  destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
  muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
  accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
  popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
  card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' } } } } };
</script>
<style type="text/tailwindcss">
@layer base { :root {
  --background: 0 0% 100%; --foreground: 240 10% 3.9%;
  --card: 0 0% 100%; --card-foreground: 240 10% 3.9%;
  --popover: 0 0% 100%; --popover-foreground: 240 10% 3.9%;
  --primary: 240 5.9% 10%; --primary-foreground: 0 0% 98%;
  --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
  --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
  --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
  --destructive: 0 84.2% 60.2%; --destructive-foreground: 0 0% 98%;
  --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 240 5.9% 10%;
} }
</style>
</head>
<body class="bg-background text-foreground">
<div id="app-root" class="min-h-screen bg-background text-foreground p-6 font-sans antialiased">
  <!-- Main Container -->
  <div class="max-w-4xl mx-auto space-y-8">

    <!-- Header Section -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-border pb-6">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Moje rozpracované žádosti</h1>
        <p class="text-muted-foreground mt-1">Seznam vašich nezávěrečných podání.</p>
      </div>

      <!-- Action Buttons: Export / Import -->
      <div class="flex gap-2">
        <button onclick="exportData()" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4 py-2">
          <img aria-hidden="true" alt="Download icon" src="https://placehold.co/24x24.svg?text=📥" class="mr-2 h-4 w-4" />
          Exportovat do souboru (JSON)
        </button>
        <label class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-4 py-2 cursor-pointer">
          <img aria-hidden="true" alt="Upload icon" src="https://placehold.co/24x24.svg?text=📤" class="mr-2 h-4 w-4" />
          Importovat ze souboru
          <input type="file" accept=".json" class="hidden" onchange="importData(this)" />
        </label>
      </div>
    </header>

    <!-- Drafts List -->
    <div id="drafts-container" class="space-y-4">
      <!-- Items will be injected here via JS -->
    </div>

    <!-- Danger Zone: Delete All -->
    <div class="pt-8 border-t border-border">
      <button onclick="deleteAllData()" class="group inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-destructive text-destructive hover:bg-destructive hover:text-destructive-foreground h-10 px-4 py-2">
        <img aria-hidden="true" alt="Trash icon" src="https://placehold.co/24x24.svg?text=🗑️" class="mr-2 h-4 w-4 transition-transform group-hover:scale-110" />
        Smazat všechna moje data
      </button>
      <p class="mt-3 text-sm text-muted-foreground">
        Údaje jsou uloženy jen v tomto prohlížeči. Po smazání je nelze obnovit.
      </p>
    </div>

  </div>
</div>

<script>
  // Initial State (Simulating data)
  const initialData = [
    { id: 1, title: "Ztráta zavazadla, let OK 123", type: "Cestovní pojištění", updated: "14. 9. 2026" },
    { id: 2, title: "Nehoda na parkovišti", type: "Auto pojištění", updated: "2. 10. 2026" },
    { id: 3, title: "Vytopená koupelna", type: "Domácí pojištění", updated: "20. 10. 2026" }
  ];

  // Render Function
  function renderDrafts(drafts) {
    const container = document.getElementById('drafts-container');
    container.innerHTML = '';

    if (drafts.length === 0) {
      container.innerHTML = `<div class="text-center py-12 text-muted-foreground">Žádné rozpracované žádosti.</div>`;
      return;
    }

    drafts.forEach(draft => {
      const card = document.createElement('div');
      card.className = 'group flex flex-col md:flex-row justify-between items-start md:items-center gap-4 p-6 bg-card border border-border rounded-lg hover:bg-secondary/50 transition-colors';

      // Icon based on type
      let iconUrl = '/icons/24x24.svg?text=📄';
      if (draft.type.includes('Cestovní')) iconUrl = '/icons/24x24.svg?text=✈️';
      if (draft.type.includes('Auto')) iconUrl = '/icons/24x24.svg?text=🚗';
      if (draft.type.includes('Domácí')) iconUrl = '/icons/24x24.svg?text=🏠';

      card.innerHTML = `
        <div class="flex items-center gap-4">
          <img aria-hidden="true" alt="${draft.title}" src="${iconUrl}" class="h-10 w-10 rounded-md bg-muted" />
          <div>
            <h3 class="font-semibold text-lg">${draft.title}</h3>
            <p class="text-sm text-muted-foreground mt-1">Typ: ${draft.type}</p>
            <p class="text-xs text-muted-foreground mt-0.5 flex items-center gap-1">
              Upraveno: ${draft.updated}
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
          <button onclick="deleteDraft(${draft.id})" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-9 px-3">
            Smazat
          </button>
          <button onclick="continueDraft(${draft.id})" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4">
            Pokračovat
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Logic Functions
  function continueDraft(id) {
    alert(`Pokračování v žádosti: ${initialData.find(d => d.id === id).title}`);
  }

  function deleteDraft(id) {
    if(confirm('Opravdu chcete smazat tuto žádost?')) {
      const index = initialData.findIndex(d => d.id === id);
      if (index > -1) {
        initialData.splice(index, 1);
        renderDrafts(initialData);
      }
    }
  }

  function deleteAllData() {
    if(confirm('POZOR: Toto nenávratně smaže všechny vaše rozpracované žádosti v tomto prohlížeči. Jste si jisti?')) {
      initialData = [];
      renderDrafts(initialData);
    }
  }

  function exportData() {
    const dataStr = JSON.stringify(initialData, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zadosti_${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function importData(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const json = JSON.parse(e.target.result);
        // Simple validation
        if (Array.isArray(json)) {
          initialData = json;
          renderDrafts(initialData);
          alert('Úspěšně importováno ' + json.length + ' žádostí.');
        } else {
          throw new Error("Neplatný formát JSON");
        }
      } catch (err) {
        alert('Chyba při čtení souboru: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // Initial Render
  renderDrafts(initialData);
</script>
</body>
</html>
