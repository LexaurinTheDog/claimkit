# Required gates by level. A required gate that cannot run makes the verdict
# MISCONFIGURED (exit 2), never GREEN. Space-separated gate names.
#
# Available names: types lint test build audit mutation architecture
# Add build or mutation when the repository has a real command for it.

REQUIRED_FAST="types lint"
# build is required: a passing static export is part of every change being shippable.
REQUIRED_FULL="types lint test build"
REQUIRED_DEEP="types lint test build audit architecture"

